<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semua trayek angkot Medan | AngkotMedan</title>
  <meta name="description" content="Daftar 118 trayek angkot di Kota Medan beserta operator, warna, dan haltenya.">
  <meta property="og:title" content="Semua trayek angkot Medan | AngkotMedan">
  <meta property="og:description" content="Daftar 118 trayek angkot di Kota Medan beserta operator, warna, dan haltenya.">
  <meta property="og:image" content="/img/hero-angkot.jpg">
  <meta name="theme-color" content="#0c6b45">
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="apple-touch-icon" href="/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header" id="site-navbar">
    <div class="wrap">
      <a class="brand" href="/"><img src="/logo.png" alt=""> AngkotMedan</a>
      <nav class="site-nav" aria-label="Utama">
        <a href="/" data-i18n="nav_home">Beranda</a>
        <a href="/semua-trayek" aria-current="page">Trayek</a>
        <a href="/tentang" data-i18n="nav_about">Tentang</a>
        <div class="lang">
          <button type="button" class="lang-toggle" id="lang-toggle" aria-label="Ganti bahasa"><i data-lucide="globe"></i><span id="lang-label">ID</span></button>
          <div class="lang-menu hidden" id="lang-dropdown">
          <button type="button" class="lang-option" data-lang="id">Indonesia</button>
          <button type="button" class="lang-option" data-lang="en">English</button>
          <button type="button" class="lang-option" data-lang="jv">Jawa</button>
          <button type="button" class="lang-option" data-lang="ms">Melayu</button>
          <button type="button" class="lang-option" data-lang="btk">Batak</button>
          <button type="button" class="lang-option" data-lang="min">Minang</button>
          <button type="button" class="lang-option" data-lang="su">Sunda</button>
          <button type="button" class="lang-option" data-lang="ace">Aceh</button>
          </div>
        </div>
      </nav>
    </div>
  </header>

  <main>
    <div class="wrap" id="route-explorer">
      <div class="page-head">
        <h1 data-i18n="explore_title">Semua Trayek Angkot</h1>
        <p class="lede" data-i18n="explorer_desc">Lihat semua 118 trayek angkot di Medan. Klik kartu untuk lihat rute detail.</p>
        <div class="filters">
          <input type="search" id="explorer-search" aria-label="Cari trayek" data-i18n-placeholder="explorer_search" placeholder="Cari nomor trayek atau nama operator...">
          <div class="chips" role="group" aria-label="Saring menurut warna angkot">
          <button type="button" class="chip explorer-filter-btn" data-filter="" aria-pressed="true">Semua</button>
          <button type="button" class="chip explorer-filter-btn" data-filter="Kuning" aria-pressed="false"><i style="background:#F7C600"></i>Kuning</button>
          <button type="button" class="chip explorer-filter-btn" data-filter="Biru" aria-pressed="false"><i style="background:#1F6FD0"></i>Biru</button>
          <button type="button" class="chip explorer-filter-btn" data-filter="Hijau" aria-pressed="false"><i style="background:#1E9E5A"></i>Hijau</button>
          <button type="button" class="chip explorer-filter-btn" data-filter="Merah" aria-pressed="false"><i style="background:#C8372D"></i>Merah</button>
          <button type="button" class="chip explorer-filter-btn" data-filter="Putih" aria-pressed="false"><i style="background:#FFFFFF"></i>Putih</button>
          </div>
        </div>
      </div>
      <p class="note" id="explorer-count"></p>
      <div class="route-list" id="explorer-grid"></div>
      <div class="pager" id="explorer-pagination"></div>
    </div>
  </main>

  <div class="modal hidden" id="route-detail-modal" role="dialog" aria-modal="true" aria-labelledby="modal-route-title">
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal-sheet">
      <div class="modal-top">
        <h2 id="modal-route-title"></h2>
        <button type="button" class="modal-close" id="modal-close" aria-label="Tutup"><i data-lucide="x"></i></button>
      </div>
      <p class="modal-facts" id="modal-stats"></p>
      <div class="modal-map" id="modal-map"></div>
      <h3 data-i18n="modal_stops">Daftar Halte</h3>
      <ol class="stop-list" id="modal-stops"></ol>
      <button type="button" class="btn btn-go" id="modal-search-btn">Cari rute di trayek ini</button>
    </div>
  </div>

  <footer class="site-footer" id="site-footer">
    <div class="wrap">
      <span>AngkotMedan. Data dari sumber publik dan pengamatan lapangan, bukan layanan resmi Dishub Kota Medan.</span>
      <a href="https://github.com/Ariefhuda/AngkotMedan">Kode sumber</a>
    </div>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script src="/js/livery.js"></script>
  <script src="/js/app.js"></script>
  <script>
    document.addEventListener('angkot:data', () => {
      renderRouteExplorer();
      document.getElementById('explorer-search').addEventListener('input', handleExplorerSearch);
      const chips = document.querySelectorAll('.explorer-filter-btn');
      chips.forEach(btn => {
        btn.addEventListener('click', () => {
          explorerFilter = btn.dataset.filter || '';
          explorerPage = 1;
          chips.forEach(c => c.setAttribute('aria-pressed', String(c === btn)));
          renderRouteExplorer();
        });
      });
    });
  </script>
</body>
</html>
